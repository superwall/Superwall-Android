name: Firebase trial

# TEMPORARY. Runs WebCheckoutProbe on the physical Pixel 7: presents the paywall with the Stripe
# button and taps its purchase button, to see what a web purchase test would have to drive.
#
# Runs only on pushes to the trial branch that touch this file. Delete it once the results are in.

on:
  push:
    branches: [ ir/festive-brown-z869g4 ]
    paths: [ .github/workflows/firebase-trial.yml ]

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        kind: [ physical ]
    env:
      RESULTS_DIR: trial-${{ matrix.kind }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

    - name: Build app and test APKs
      run: |
        chmod +x ./gradlew
        ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -x lint -x lintDebug -x lintVitalRelease

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: Authenticate
      env:
        SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
      run: |
        umask 077
        printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
        gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
        gcloud config set project "$(jq -r .project_id "$RUNNER_TEMP/sa.json")" --quiet 2>/dev/null
        rm -f "$RUNNER_TEMP/sa.json"

    - name: Run on the physical Pixel 7
      if: matrix.kind == 'physical'
      continue-on-error: true
      run: |
        set -o pipefail
        gcloud firebase test android run \
          --type instrumentation \
          --use-orchestrator \
          --app app/build/outputs/apk/debug/app-debug.apk \
          --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
          --device model=panther,version=33,locale=en,orientation=portrait \
          --test-targets "class com.example.superapp.test.WebCheckoutProbe" \
          --environment-variables clearPackageData=true \
          --directories-to-pull /sdcard/Download \
          --timeout 10m \
          --results-dir "$RESULTS_DIR" 2>&1 | tee "$RUNNER_TEMP/ftl.log"

    # Per device: the test report, and for each failed comparison the screen as captured
    # (reference/) and the side-by-side difference (diff/). Device logs and video stay in the bucket.
    - name: Fetch results
      if: always()
      run: |
        bucket=$(grep -o 'test-lab-[a-z0-9-]*' "$RUNNER_TEMP/ftl.log" | head -n 1 || true)
        if [ -z "$bucket" ]; then echo "No results bucket in the output."; exit 0; fi
        base="gs://$bucket/$RESULTS_DIR"
        mkdir -p results
        for device in $(gsutil ls "$base/" | grep '/$' | xargs -n 1 basename); do
          mkdir -p "results/$device/reference" "results/$device/diff"
          gsutil -m -q cp "$base/$device/*.xml" "results/$device/" || true
          gsutil -m -q cp "$base/$device/**/screenshots/**/reference/*.png" "results/$device/reference/" || true
          gsutil -m -q cp "$base/$device/**/screenshots/**/diff/*.png" "results/$device/diff/" || true
          mkdir -p "results/$device/probe"
          gsutil -m -q cp "$base/$device/**/Download/probe/*" "results/$device/probe/" || true
          cat "results/$device/probe/log.txt" 2>/dev/null || echo "no probe log"
        done
        python3 - <<'PY'
        import glob, os, xml.etree.ElementTree as ET
        for device in sorted(os.listdir('results')):
            passed = failed = 0
            print(f"== {device}")
            for path in glob.glob(f'results/{device}/*.xml'):
                for case in ET.parse(path).getroot().iter('testcase'):
                    problem = case.find('failure')
                    if problem is None:
                        problem = case.find('error')
                    if problem is None:
                        if case.find('skipped') is None:
                            passed += 1
                        continue
                    failed += 1
                    text = (problem.text or problem.get('message') or '').strip().splitlines()
                    print(f"FAILED {case.get('classname', '').split('.')[-1]}.{case.get('name')}")
                    print(f"    {' | '.join(text[:2])[:900] if text else ''}")
            captures = len(glob.glob(f'results/{device}/reference/*.png'))
            print(f"passed: {passed}  failed: {failed}  captured screens: {captures}")
        PY

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: firebase-trial-${{ matrix.kind }}
        path: results/
