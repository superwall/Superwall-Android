# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Build, Test & Publish

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Maven Central, tag, and create a GitHub release from this ref. Use for special releases cut from non-main branches (e.g. backport releases)."
        type: boolean
        default: false

permissions:
  contents: write

# Prevents running a bunch of we push right back to back
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: android-large-runner

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Set Up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu' # See 'Supported distributions' for available options
        java-version: '17'
        cache: 'gradle'

    # Allow us to run the command
    - name: Change wrapper permissions
      run: chmod +x ./gradlew

    # Assemble the SDK modules (tests/lint run in pr-tests.yml)
    - name: Build gradle project
      run: ./gradlew :superwall:assemble :superwall-compose:assemble

    # See what version we're on
    # Writes to superwall/build/version.json with the version set 
    # in the superwall build.gradle
    - name: Generate version from config
      run: ./gradlew :superwall:generateBuildInfo

    - name: Get Version
      uses: notiz-dev/github-action-json-property@release
      id: version
      with:
        path: "superwall/build/version.json"
        prop_path: "version"

    # Only try to publish on a push to main, or on a manual dispatch that
    # explicitly opted into publishing (special releases off non-main branches).
    - name: Check if tag exists
      if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
      id: check-tag
      run: |
        EXISTS=$(git tag -l | grep -Fxq "${{steps.version.outputs.prop}}" && echo 'true' || echo 'false')
        echo "::set-output name=tag-exists::$EXISTS"

    - name: Import GPG key
      if: steps.check-tag.outputs.tag-exists == 'false'
      run: |
        echo "${{ secrets.GPG_SIGNING_KEY }}" | base64 -d > private.key
        gpg --batch --import private.key
        rm private.key

    - name: Deploy
      if: steps.check-tag.outputs.tag-exists == 'false'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
      # mavenCentralAutomaticPublishing releases the deployment in the Central
      # Portal automatically, so no manual "Publish" click is needed anymore.
      run: |
        ./gradlew :superwall:publish --no-configuration-cache -PmavenCentralAutomaticPublishing=true
        ./gradlew :superwall-compose:publish --no-configuration-cache -PmavenCentralAutomaticPublishing=true

    - name: Determine prerelease status
      id: prerelease
      run: |
        VERSION=${{steps.version.outputs.prop}}
        if [[ "$VERSION" == *"-alpha"* || "$VERSION" == *"-beta"* || "$VERSION" == *"-rc"* ]]; then
          echo "::set-output name=status::true"
        else
          echo "::set-output name=status::false"
        fi

    - name: Tag
      if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
      run: |
        if [ "${{ steps.check-tag.outputs.tag-exists }}" == "false" ]; then
          sudo git config --global user.name 'Jake'
          sudo git config --global user.email 'jakemor@users.noreply.github.com'
          sudo git pull
          echo "\n\n\n- - - - - VERSION - - - - -\n\n\n"
          echo ${{steps.version.outputs.prop}}
          echo "\n\n\n- - - - - END VERSION - - - - -\n\n\n"
          sudo git tag -a ${{steps.version.outputs.prop}} -m "tags with latest version"
          sudo git push --tags
          sudo git checkout -b release/${{steps.version.outputs.prop}}
          sudo git push -u origin release/${{steps.version.outputs.prop}}
        fi

    # Pull the "## <version>" section out of CHANGELOG.md to use as the
    # release description. Version headings look like "## 2.7.22"; the
    # section ends at the next version heading (or "## Unreleased").
    - name: Extract release notes from changelog
      if: steps.check-tag.outputs.tag-exists == 'false'
      run: |
        VERSION="${{ steps.version.outputs.prop }}"
        awk -v ver="$VERSION" '
          /^## / && $2 == ver { found = 1; next }
          found && /^## / && ($2 ~ /^[0-9]+\./ || $2 == "Unreleased") { exit }
          found { print }
        ' CHANGELOG.md > release-notes.md
        # Trim leading blank lines
        sed -i -e '/./,$!d' release-notes.md
        if [ ! -s release-notes.md ]; then
          echo "No CHANGELOG.md entry found for $VERSION, falling back to a link."
          echo "See the [CHANGELOG](https://github.com/superwall/Superwall-Android/blob/main/CHANGELOG.md) for details." > release-notes.md
        fi
        echo "Release notes for $VERSION:"
        cat release-notes.md

    - name: Create GitHub release
      if: steps.check-tag.outputs.tag-exists == 'false'
      id: release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.prop }}
        name: ${{ steps.version.outputs.prop }}
        body_path: release-notes.md
        prerelease: ${{ steps.prerelease.outputs.status }}
        # Releases created with GITHUB_TOKEN don't trigger other workflows,
        # so use a PAT to keep on-release.yml (paywall-next dispatch) working.
        token: ${{ secrets.MAIN_REPO_PAT || secrets.GITHUB_TOKEN }}

    - name: slack-send
      # Only notify on a new tag
      if: steps.check-tag.outputs.tag-exists == 'false'
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "Android SDK ${{steps.version.outputs.prop}} was published to Maven Central and released: ${{ steps.release.outputs.url }}"
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
