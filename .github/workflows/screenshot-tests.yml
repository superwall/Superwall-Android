name: Screenshot tests

# Runs the :app screenshot and flow tests on an API 33 Google Play emulator and compares them
# with the Emulator_Pixel_7_API_33 baselines in app/src/androidTest/screenshots.
#
# Paywalls with products need Play billing, which needs a Google account, so the job signs the
# emulator in with scripts/play_login.sh first. The account comes from the TEST_USER and TEST_PW
# secrets. See that script for how they are kept out of logs and files; nothing from the
# sign-in is uploaded, as its screenshots can show the account's email address.
#
# The physical Pixel 7 on Firebase Test Lab (build+test.yml) stays the check before a release.

on:
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAESTRO_VERSION: 2.12.1
  MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Pull requests from forks don't get the secrets, and can't sign in.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Free disk space
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      with:
        android: false
        tool-cache: true
        dotnet: true
        haskell: true
        swap-storage: true
        docker-images: false
        large-packages: false

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

    - name: Change wrapper permissions
      run: chmod +x ./gradlew

    - name: Install Maestro
      run: |
        curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
        echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum --check
        unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/maestro-cli"
        echo "$HOME/maestro-cli/maestro/bin" >> "$GITHUB_PATH"

    # Build before the emulator boots, so a compile error doesn't cost a boot and a sign-in.
    - name: Build app and test APKs
      run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -x lint -x lintDebug -x lintVitalRelease

    # The emulator is created fresh and never saved: a snapshot taken after the sign-in would
    # put the account's tokens in the Actions cache.
    - name: Sign in to Google Play and run screenshot tests
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
      env:
        TEST_USER: ${{ secrets.TEST_USER }}
        TEST_PW: ${{ secrets.TEST_PW }}
        MAESTRO_CLI_NO_ANALYTICS: 1
      with:
        api-level: 33
        target: playstore
        arch: x86_64
        profile: pixel_7
        force-avd-creation: true
        ram-size: 4096M
        emulator-boot-timeout: 1800
        disable-animations: true
        emulator-options: >
          -no-snapshot
          -no-window
          -gpu swiftshader_indirect
          -no-boot-anim
          -noaudio
          -camera-back none
          -camera-front none
        script: >
          scripts/play_login.sh &&
          ./gradlew :app:connectedDebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.notClass=com.example.superapp.benchmark.PaywallPreloadBenchmark
          -x lint -x lintDebug -x lintVitalRelease

    # For every failed comparison: the screen as captured (reference/) and the baseline, capture
    # and difference side by side (diff/). To accept a change, copy the reference/ images into
    # app/src/androidTest/screenshots.
    - name: Upload test results and screenshots
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: screenshot-test-results
        path: |
          app/build/reports/androidTests/connected/
          app/build/outputs/androidTest-results/connected/
