name: Firebase virtual device trial

# TEMPORARY, one-off. Answers one question: can the :app screenshot tests run on a Firebase Test
# Lab virtual device? Test Lab signs its devices in to a Google account itself, so this needs no
# login flow. What to look for is whether paywalls with products present there, and how close
# the screens are to the Emulator_Pixel_7_API_33 baselines.
#
# Runs only on pushes to the trial branch. Delete this file once the result is in.

on:
  push:
    branches: [ ir/festive-brown-z869g4 ]
    paths: [ .github/workflows/firebase-virtual-trial.yml ]

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RESULTS_DIR: virtual-trial-${{ github.run_id }}-${{ github.run_attempt }}
      DEVICE_MODEL: MediumPhone.arm

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

    - name: Build app and test APKs
      run: |
        chmod +x ./gradlew
        ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -x lint -x lintDebug -x lintVitalRelease

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: Authenticate
      env:
        SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
      run: |
        umask 077
        printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
        gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
        gcloud config set project "$(jq -r .project_id "$RUNNER_TEMP/sa.json")" --quiet 2>/dev/null
        rm -f "$RUNNER_TEMP/sa.json"

    - name: List virtual devices
      run: gcloud firebase test android models list --filter="form=VIRTUAL"

    - name: Run tests on the virtual device
      id: run
      continue-on-error: true
      run: |
        set -o pipefail
        gcloud firebase test android run \
          --type instrumentation \
          --use-orchestrator \
          --app app/build/outputs/apk/debug/app-debug.apk \
          --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
          --device "model=$DEVICE_MODEL,version=33,locale=en,orientation=portrait" \
          --test-targets "notClass com.example.superapp.benchmark.PaywallPreloadBenchmark" \
          --directories-to-pull /sdcard/Download \
          --timeout 45m \
          --results-dir "$RESULTS_DIR" 2>&1 | tee "$RUNNER_TEMP/ftl.log"

    # The test report, and for each failed comparison the screen as captured (reference/) and
    # the side-by-side difference (diff/). Device logs and video stay in the bucket.
    - name: Fetch results
      if: always()
      run: |
        bucket=$(grep -o 'test-lab-[a-z0-9-]*' "$RUNNER_TEMP/ftl.log" | head -n 1 || true)
        if [ -z "$bucket" ]; then echo "No results bucket in the output."; exit 0; fi
        base="gs://$bucket/$RESULTS_DIR"
        mkdir -p results/xml results/reference results/diff
        gsutil -m -q cp "$base/**/*.xml" results/xml/ || true
        gsutil -m -q cp "$base/**/screenshots/**/reference/*.png" results/reference/ || true
        gsutil -m -q cp "$base/**/screenshots/**/diff/*.png" results/diff/ || true
        echo "reference: $(ls results/reference | wc -l)  diff: $(ls results/diff | wc -l)"
        python3 - <<'PY'
        import glob, xml.etree.ElementTree as ET
        passed = failed = 0
        for path in glob.glob('results/xml/*.xml'):
            for case in ET.parse(path).getroot().iter('testcase'):
                problem = case.find('failure')
                if problem is None:
                    problem = case.find('error')
                if problem is None:
                    if case.find('skipped') is None:
                        passed += 1
                    continue
                failed += 1
                text = (problem.text or problem.get('message') or '').strip().splitlines()
                print(f"FAILED {case.get('classname', '').split('.')[-1]}.{case.get('name')}")
                print(f"    {text[0][:600] if text else ''}")
        print(f"passed: {passed}  failed: {failed}")
        PY

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: firebase-virtual-trial
        path: results/
